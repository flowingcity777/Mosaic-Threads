<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mosaic Threads | Stitch Pattern Generator</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header>
    <h1>Transform any image <span>Into a soulful stitch pattern</span></h1>
  </header>

  <main>
    <!-- Image Upload -->
    <section class="upload-section">
      <button id="upload-btn" class="btn btn-primary">Upload Image</button>
      <input type="file" id="image-upload" accept="image/*" style="display: none;">
      <button id="generateBtn" class="btn btn-primary">Generate Pattern</button>
      <button id="clear-btn" class="btn btn-secondary">Clear Canvas</button>
    </section>

    <!-- Canvas Grid -->
    <div id="canvas-container"></div>

    <!-- Thread Palette -->
    <div id="thread-palette"></div>

    <!-- Pattern Tools -->
    <div class="center">
      <button id="saveBtn" class="btn btn-primary" disabled>Save to My Patterns</button>
      <input type="text" id="pattern-name" placeholder="Pattern Name">
    </div>

    <!-- Pattern Library -->
    <section id="pattern-library">
      <h2>My Saved Patterns</h2>
      <div id="saved-patterns"></div>
    </section>
  </main>
  <script src="js/script.js"></script>
</body>
</html>
